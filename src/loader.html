<style>
  #loading {
    position: fixed; inset: 0; z-index: 10; display: grid; place-content: center; justify-items: center; gap: 18px;
    background: #15161f; color: #f1e2c4; font: 14px/1.3 "Silkscreen", ui-monospace, Menlo, monospace; letter-spacing: 0.06em;
    transition: opacity 0.5s ease;
  }
  #loading.done { opacity: 0; pointer-events: none; }
  #loading .jar { position: relative; width: 96px; height: 120px; border: 4px solid #4c5070; border-top-width: 10px; border-radius: 4px; background: linear-gradient(#5ccfe3, #2c82c2 70%, #1a4f8f); overflow: hidden; image-rendering: pixelated; }
  #loading .jar::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 14px; background: #e3c088; box-shadow: inset 0 3px 0 #f4ddaa; }
  #loading .b { position: absolute; bottom: 14px; width: 6px; height: 6px; border: 2px solid #dff8ff; border-radius: 50%; animation: jt-rise 1.8s linear infinite; opacity: 0; }
  #loading .b:nth-child(1) { left: 22px; }
  #loading .b:nth-child(2) { left: 52px; width: 4px; height: 4px; animation-delay: 0.6s; }
  #loading .b:nth-child(3) { left: 70px; animation-delay: 1.2s; }
  #loading .msg[data-error] { color: #ff8a7a; max-width: 260px; text-align: center; }
  @keyframes jt-rise { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(-96px); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { #loading .b { animation: none; opacity: 1; } }
</style>
<div id="loading" role="status" aria-live="polite">
  <div class="jar" aria-hidden="true"><span class="b"></span><span class="b"></span><span class="b"></span></div>
  <div class="msg">Filling the tank…</div>
</div>
