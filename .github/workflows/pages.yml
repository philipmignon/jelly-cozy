# Builds the game and deploys dist/ to GitHub Pages on every push to main (or by hand from the Actions tab).
# Pushes only deploy once the repo variable PAGES_ENABLED is "true" (set it after turning Pages on in
# Settings → Pages → Source: GitHub Actions), so pushes don't fail while Pages is off.
# No Python or Rive CLI here: the built public/jellytank.riv, the sprite groups in public/sprites/ and the
# generated src/*.json are committed. Rebuild them locally with `npm run riv:build` before pushing art changes.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
